# One SDK, whose jar Gradle resolves and verifies (app/build.gradle.kts); Robolectric runs offline.
# 34, not 35: Robolectric needs Java 21 for SDK 35, and CI runs Java 17.
sdk=34
# A plain Application, so a Robolectric test doesn't start FieldwatchApp's stores and services.
# A test that needs the real one asks for it with @Config(application = FieldwatchApp::class).
application=android.app.Application
