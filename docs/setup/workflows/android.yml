name: Android CI

# Draft (P0-8a). The agent can't push .github/workflows/, so it drafts this file here. After review, the
# owner copies it over .github/workflows/android.yml. The job names "Unit tests" and "APK" stay as they
# were, so required-check settings keep matching.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the lint-baseline guard reads the base branch's copy
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Counts each passing debug test case once, by (module, class, name), so another variant's run or a
      # duplicated result file can't inflate the total. Compares it with the protected baseline, which only
      # an owner-signed PR can lower. Phase 2 modules extend the pattern with their own test task.
      - name: Test-count guard
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import glob, re, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob("**/build/test-results/testDebugUnitTest/TEST-*.xml", recursive=True))
          if not files:
              print("::error::No debug unit-test results found.")
              sys.exit(1)
          passed = set()
          for path in files:
              module = path.split("/build/", 1)[0]
              for case in ET.parse(path).getroot().iter("testcase"):
                  if any(case.find(t) is not None for t in ("failure", "error", "skipped")):
                      continue
                  passed.add((module, case.get("classname"), case.get("name")))
          with open("docs/plan/test-baseline.txt", encoding="utf-8") as f:
              baseline = next(int(l.strip()) for l in f if re.fullmatch(r"\d+", l.strip()))
          print(f"{len(passed)} passing tests in {len(files)} result files; baseline {baseline}.")
          if len(passed) < baseline:
              print(f"::error::Passing tests fell below the baseline: {len(passed)} < {baseline}.")
              sys.exit(1)
          PY

      - name: Lint
        if: success() || failure()
        run: ./gradlew lintDebug --stacktrace

      # app/lint-baseline.xml holds the inherited errors (P1-A8 clears it). A PR may shrink it, never grow
      # it, and the report must hold no error the baseline doesn't cover (catches abortOnError = false).
      - name: Lint-baseline guard
        if: success() || failure()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          report=app/build/reports/lint-results-debug.xml
          if [ ! -f "$report" ]; then
            echo "::error::$report is missing."
            exit 1
          fi
          if grep -Eq 'severity="(Error|Fatal)"' "$report"; then
            echo "::error::The lint report has errors the baseline doesn't cover."
            exit 1
          fi
          issue='<issue([[:space:]]|$)' # not the <issues> root
          head_n=$(grep -cE "$issue" app/lint-baseline.xml 2>/dev/null || true)
          base_n=$(git show "$BASE_SHA:app/lint-baseline.xml" 2>/dev/null | grep -cE "$issue" || true)
          if git cat-file -e "$BASE_SHA:app/lint-baseline.xml" 2>/dev/null && [ "${head_n:-0}" -gt "${base_n:-0}" ]; then
            echo "::error::app/lint-baseline.xml grew from $base_n to $head_n entries."
            exit 1
          fi
          echo "Lint baseline: ${head_n:-0} entries (base ${base_n:-none})."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  build:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # tags, so the APK is X.Y.Z-dev+<sha> from the last release (ADR-0002)
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      # Debug is what the device checklist installs. Release is never signed by Gradle (a finalizeDsl
      # check in build.gradle.kts); building it proves R8 and the resource shrinker pass. Staging is
      # minified and test-signed, and is what testers install.
      - name: Assemble debug, release (unsigned) and staging
        run: ./gradlew assembleDebug assembleRelease assembleStaging --stacktrace

      - name: Release output is the unsigned APK only
        run: |
          set -euo pipefail
          apks=$(find app/build/outputs/apk/release -name '*.apk' | sort)
          if [ "$apks" != "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "::error::Expected only app-release-unsigned.apk, found: $apks"
            exit 1
          fi

      - name: Staging signing key
        run: |
          if [ ! -f app/signing/staging-test.jks ]; then
            echo "::warning::app/signing/staging-test.jks is missing, so this staging APK is signed with the runner's throwaway debug key and can't be installed over another run's."
          fi

      - name: Upload staging APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spectre-staging-apk
          path: app/build/outputs/apk/staging/*.apk
          if-no-files-found: error
