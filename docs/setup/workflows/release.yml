name: Release

# Draft (P0-8b). The owner copies it into .github/workflows/release.yml after review (the agent's token
# can't write workflows). Two jobs, per PLAN.md "Release model" and ADR-0002:
#   A. "Build": checks the tag, builds the unsigned release APK with Gradle, and uploads it. No secrets.
#   B. "Sign and publish": runs in the `release` environment. No checkout and no Gradle: it downloads A's
#      artifact, re-derives the version from the tag itself, checks the APK's package, version and
#      debuggable flag before signing, signs, checks the certificate against the SPECTRE_CERT_SHA256
#      variable, and publishes a GitHub pre-release with both SHA-256 values.
# Tags:
#   vX.Y.Z         a real release: must be the next version after the last v* tag, on main.
#   dryrun/vX.Y.Z  a scratch run (Phase 0 exit): same checks except "next", published as a draft only.
# Release notes are hand-written in docs/release-notes/X.Y.Z.md until the generator of label and verdict
# changes lands (P0-8d).

on:
  push:
    tags: ["v*", "dryrun/v*"]

permissions:
  contents: read

# One group per tag: a shared group would cancel a queued run and burn its immutable tag. The next-version
# check already serializes real releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # tags and main, for the next-version and on-main checks
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }} # read-only here; lists published releases
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          case "$TAG" in
            v*) kind=release; version=${TAG#v} ;;
            dryrun/v*) kind=dryrun; version=${TAG#dryrun/v} ;;
            *) echo "::error::Unexpected tag $TAG."; exit 1 ;;
          esac
          # SemVer core only; X, Y and Z at most 999 (ADR-0002), so the versionCode stays unambiguous and
          # under Android's 2,100,000,000 limit.
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::$TAG is not vX.Y.Z with X, Y and Z at most 999."
            exit 1
          fi
          x=${BASH_REMATCH[1]}; y=${BASH_REMATCH[2]}; z=${BASH_REMATCH[3]}
          # Dry runs are signed with the release key too, so they stay in 0.0.x, a range no release uses.
          # Z starts at 1: 0.0.0 would be versionCode 0, and the build rejects it.
          if [ "$kind" = dryrun ] && { [ "$x.$y" != 0.0 ] || [ "$z" = 0 ]; }; then
            echo "::error::Dry-run tags must be dryrun/v0.0.Z with Z at least 1."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point at a commit on main."
            exit 1
          fi
          if [ "$kind" = release ]; then
            # The last published release (pre-releases count, drafts don't), not the highest tag: a rejected
            # tag still exists, because v* tags are immutable.
            prev=$(gh release list --repo "$REPO" --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' \
              | sed -n 's/^v//p' | grep -E "$semver" | grep -vxF "$version" | sort -V | tail -1 || true)
            if [ -z "$prev" ]; then
              allowed="0.1.0"
            else
              IFS=. read -r px py pz <<< "$prev"
              allowed="$px.$py.$((pz + 1)) $px.$((py + 1)).0 $((px + 1)).0.0"
            fi
            if ! printf '%s\n' $allowed | grep -qxF "$version"; then
              echo "::error::$TAG is not the next version after ${prev:-no release}; allowed: $allowed"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((x * 1000000 + y * 1000 + z))" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true # a release builds from a clean cache

      - name: Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble release (unsigned)
        # No daemon, so no build code keeps running to swap the APK after the checks below.
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      # The APK must carry the tag's version. The build derives it from the triggering tag (P0-8c, via
      # GITHUB_REF_NAME), and a dirty tree or a mismatch fails here, before any tag is signed.
      - name: Check the APK's version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CODE: ${{ steps.tag.outputs.code }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          line=$(sed -n 1p "$RUNNER_TEMP/badging.txt")
          echo "$line"
          case "$line" in
            *"versionCode='$CODE' versionName='$VERSION'"*) ;;
            *) echo "::error::The APK is not versionCode $CODE / versionName $VERSION."; exit 1 ;;
          esac

      # Real releases need notes written in the release PR. PLAN: they list every label and verdict change.
      - name: Release notes
        env:
          KIND: ${{ steps.tag.outputs.kind }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/
          if [ "$KIND" = release ]; then
            notes="docs/release-notes/$VERSION.md"
            if [ ! -s "$notes" ]; then
              echo "::error::$notes is missing or empty."
              exit 1
            fi
            cp "$notes" out/notes.md
          else
            printf 'Dry run of the release workflow. Not for installation.\n' > out/notes.md
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release
          path: out/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-release
          path: in

      # Re-derive everything from the tag; nothing from job A is trusted except the APK and the notes text.
      - name: Sign, verify and publish
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.SPECTRE_KEYSTORE_B64 }}
          SPECTRE_STORE_PASSWORD: ${{ secrets.SPECTRE_STORE_PASSWORD }}
          SPECTRE_KEY_PASSWORD: ${{ secrets.SPECTRE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPECTRE_KEY_ALIAS }}
          CERT_SHA256: ${{ vars.SPECTRE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) kind=release; version=${TAG#v} ;;
            dryrun/v*) kind=dryrun; version=${TAG#dryrun/v} ;;
            *) echo "::error::Unexpected tag $TAG."; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::$TAG is not vX.Y.Z with X, Y and Z at most 999."
            exit 1
          fi
          x=${BASH_REMATCH[1]}; y=${BASH_REMATCH[2]}; z=${BASH_REMATCH[3]}
          if [ "$kind" = dryrun ] && { [ "$x.$y" != 0.0 ] || [ "$z" = 0 ]; }; then
            echo "::error::Dry-run tags must be dryrun/v0.0.Z with Z at least 1."
            exit 1
          fi
          code=$((x * 1000000 + y * 1000 + z))
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          if [ ! -x "$signer" ] || [ ! -x "$aapt2" ]; then
            echo "::error::build-tools 35.0.0 is not on this runner image."
            exit 1
          fi

          # Job A ran build code, so check what it handed over before the release key touches it. The
          # applicationId changes in P0-4e; that owner-signed PR updates this line too.
          "$aapt2" dump badging in/app-release-unsigned.apk > "$RUNNER_TEMP/badging.txt"
          head1=$(sed -n 1p "$RUNNER_TEMP/badging.txt")
          case "$head1" in
            "package: name='app.fieldwatch' versionCode='$code' versionName='$version' "*) ;;
            *) echo "::error::Unexpected APK: $head1 (want app.fieldwatch, $code, $version)."; exit 1 ;;
          esac
          if grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"; then
            echo "::error::The APK is debuggable."
            exit 1
          fi
          if grep -Eqi -- '<!--|SHA-256|verify before you install' in/notes.md; then
            echo "::error::The notes contain an HTML comment or their own hash lines."
            exit 1
          fi
          if [ -z "${CERT_SHA256:-}" ] || [ -z "${KS_B64:-}" ]; then
            echo "::error::The release environment's keystore secret or SPECTRE_CERT_SHA256 variable is missing."
            exit 1
          fi

          ks="$RUNNER_TEMP/spectre-release.p12"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KS_B64" | base64 -d > "$ks"
          out="spectre-$version.apk"
          "$signer" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:SPECTRE_STORE_PASSWORD --key-pass env:SPECTRE_KEY_PASSWORD \
            --out "$out" in/app-release-unsigned.apk
          rm -f "$ks"
          unset KS_B64 SPECTRE_STORE_PASSWORD SPECTRE_KEY_PASSWORD KEY_ALIAS

          certs=$("$signer" verify --print-certs "$out")
          signers=$(printf '%s\n' "$certs" | grep -c 'certificate SHA-256 digest' || true)
          got=$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          want=$(printf '%s' "$CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ': ')
          if [ "$signers" != 1 ] || [ "$got" != "$want" ]; then
            echo "::error::Signed APK certificate is '$got' ($signers signers); expected $want."
            exit 1
          fi
          apk_sha=$(sha256sum "$out" | cut -d' ' -f1)

          # The hashes come first, so nothing in the notes can push them out of view.
          {
            printf '## Verify before you install\n\n'
            printf -- '- APK SHA-256: `%s`\n' "$apk_sha"
            printf -- '- Signing certificate SHA-256: `%s`\n\n' "$got"
            cat in/notes.md
          } > notes.md

          if [ "$kind" = release ]; then
            gh release create "$TAG" "$out" --repo "$REPO" --verify-tag --prerelease \
              --title "Spectre $version" --notes-file notes.md
          else
            gh release create "$TAG" "$out" --repo "$REPO" --verify-tag --draft \
              --title "Dry run $version" --notes-file notes.md
          fi
          echo "APK SHA-256 $apk_sha, certificate SHA-256 $got."
