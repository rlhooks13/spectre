# Spectre usage watcher settings. Protected file. Only KEY=integer lines are read.
# Work pauses when a plan window reaches its percentage, and resumes after that window resets.
# Five-hour window:
THRESHOLD_FIVE_HOUR=90
# Weekly window (owner decision, 2026-10-27: work only while weekly usage is under 80%):
THRESHOLD_SEVEN_DAY=80
# Seconds between reads of the usage file.
POLL=30
# Seconds without a status-line refresh before USAGE_STALE.
STALE=600
